events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------
    # Upstream definition for FastAPI application instances.
    # Nginx distributes traffic across these two identical instances
    # using default Round-Robin scheduling.
    # -------------------------------------------------------------
    upstream healthease_backend {
        server backend_1:8000 max_fails=3 fail_timeout=10s;
        server backend_2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body size for file/application uploads
        client_max_body_size 10M;

        # Forward all API & Application requests to balanced backend cluster
        location / {
            proxy_pass http://healthease_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP 1.1 and keep-alive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Dedicated Load Balancer Health Probe
        location /lb-health {
            access_log off;
            return 200 '{"status":"UP","balancer":"nginx","cluster":"healthease_backend"}';
            add_header Content-Type application/json;
        }
    }
}
